# Isolated test configuration using H2 in PostgreSQL mode
spring.application.name=CivicEye-Backend-Test

spring.datasource.url=jdbc:h2:mem:civiceyetest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

civiceye.follow-up.enabled=false
civiceye.follow-up.delay-minutes=2
civiceye.storage.upload-dir=target/test-uploads
civiceye.messaging.provider=mock
civiceye.messaging.default-test-recipient=+919876543210
civiceye.escalation.recipient=+919800000000
civiceye.messaging.twilio.account-sid=
civiceye.messaging.twilio.auth-token=
civiceye.messaging.twilio.from-number=
