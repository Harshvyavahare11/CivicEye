# CivicEye Spring Boot Application Properties
spring.application.name=CivicEye-Backend

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# File Upload Configuration (8MB per file, 10MB per request)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# CivicEye Custom Configuration
civiceye.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
civiceye.ai-engine.base-url=${AI_ENGINE_URL:http://localhost:8000}
civiceye.ai-engine.timeout-ms=${AI_ENGINE_TIMEOUT_MS:30000}

# Follow-Up & Scheduler Configuration
# For development/demo, default is 2 minutes; set to e.g. 2880 for 2-day production follow-up
civiceye.follow-up.delay-minutes=${FOLLOW_UP_DELAY_MINUTES:2}
civiceye.follow-up.enabled=${FOLLOW_UP_ENABLED:true}
civiceye.scheduler.poll-interval-ms=${SCHEDULER_POLL_INTERVAL_MS:15000}

# Messaging & Recipients Configuration
civiceye.messaging.default-test-recipient=${TEST_RECIPIENT_PHONE:+919876543210}
civiceye.escalation.recipient=${ESCALATION_RECIPIENT_PHONE:}

# Twilio SMS Credentials (Optional, falls back to Mock provider if unset)
civiceye.messaging.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
civiceye.messaging.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
civiceye.messaging.twilio.from-number=${TWILIO_FROM_NUMBER:}

# WhatsApp Cloud API Credentials (Optional)
civiceye.messaging.whatsapp.token=${WHATSAPP_TOKEN:}
civiceye.messaging.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# Logging
logging.level.root=INFO
logging.level.com.civiceye=DEBUG
logging.level.org.springframework.web=INFO
