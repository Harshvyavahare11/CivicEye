# CivicEye Spring Boot Application Properties
spring.application.name=CivicEye-Backend

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# File Upload Configuration (8MB per file, 10MB per request)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# CivicEye Custom Configuration
civiceye.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
civiceye.ai-engine.base-url=${AI_ENGINE_URL:http://localhost:8000}
civiceye.ai-engine.timeout-ms=${AI_ENGINE_TIMEOUT_MS:30000}

# Follow-Up & Scheduler Configuration
# For development/demo, default is 2 minutes; set to e.g. 2880 for 2-day production follow-up
civiceye.follow-up.delay-minutes=${CIVICEYE_FOLLOW_UP_DELAY_MINUTES:2}
civiceye.follow-up.enabled=${FOLLOW_UP_ENABLED:true}
civiceye.scheduler.poll-interval-ms=${SCHEDULER_POLL_INTERVAL_MS:30000}

# Messaging & Recipients Configuration
civiceye.messaging.provider=${CIVICEYE_MESSAGING_PROVIDER:mock}
civiceye.messaging.default-test-recipient=${CIVICEYE_TEST_RECIPIENT:+919876543210}
civiceye.escalation.recipient=${CIVICEYE_ESCALATION_RECIPIENT:}

# Twilio SMS Credentials (Optional, falls back to Mock provider if mock is active or unset)
civiceye.messaging.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
civiceye.messaging.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
civiceye.messaging.twilio.from-number=${TWILIO_FROM_PHONE:${TWILIO_FROM_NUMBER:}}

# WhatsApp Cloud API Credentials (Optional)
civiceye.messaging.whatsapp.token=${WHATSAPP_TOKEN:}
civiceye.messaging.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civiceye_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:system}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Evidence File Storage Configuration (MVP file-storage location)
civiceye.storage.upload-dir=${STORAGE_UPLOAD_DIR:uploads/evidence}

# Logging
logging.level.root=INFO
logging.level.com.civiceye=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO
